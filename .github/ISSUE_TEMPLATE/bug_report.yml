name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. For a security problem, please report it privately instead
        (Security tab → Report a vulnerability).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest program that shows it
      render: rust
  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: Output of `uname -r`. giong needs Linux 6.0 or newer.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: giong version or commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Bare metal, VM, WSL2 or container (and its seccomp profile)
